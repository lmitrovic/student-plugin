name: Deploy Plugin

on:
  workflow_run:
    workflows: ["Bump Plugin Version"]
    types:
      - completed

jobs:
  # 0. Provera da li je bump zaista odrađen (a ne preskočen zbog zatvorenog PR-a)
  check-bump:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - name: Proveri status bump-version job-a
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION=$(gh api \
            repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs \
            --jq '.jobs[] | select(.name == "bump-version") | .conclusion')
          echo "bump-version conclusion: $CONCLUSION"
          if [ "$CONCLUSION" = "success" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-bump
    if: needs.check-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest

    env:
      PRODUCTION_SERVER_USERNAME: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
      PRODUCTION_SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}

    steps:
      # 1. FORSIRAMO PROD GRANU (posle bump commit-a)
      - uses: actions/checkout@v4
        with:
          ref: 'prod'
          fetch-depth: 0

      # 2. Podešavanje Jave - isti JDK koji traži toolchain u build.gradle.kts
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      # 2a. Čitamo pluginSinceBuild iz gradle.properties (za XML)
      - name: Read plugin properties
        id: props
        run: |
          SINCE=$(grep -E '^\s*pluginSinceBuild' IntelliJ-Plugin/gradle.properties | cut -d= -f2 | tr -d ' \r')
          if [ -z "$SINCE" ]; then
            echo "GRESKA: pluginSinceBuild nije pronađen u gradle.properties"
            exit 1
          fi
          echo "pluginSinceBuild: $SINCE"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

      # 3. Build + potpisivanje (signPlugin zavisi od buildPlugin)
      - name: Build and sign plugin
        working-directory: IntelliJ-Plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean signPlugin verifyPluginSignature --no-configuration-cache

      # 3a. Ostavljamo samo potpisani ZIP, pod originalnim imenom (bez "-signed")
      - name: Keep only signed artifact
        working-directory: IntelliJ-Plugin/build/distributions
        run: |
          SIGNED=$(ls Student-testing-IntelliJ-plugin-*-signed.zip)
          find . -name 'Student-testing-IntelliJ-plugin-*.zip' ! -name '*-signed.zip' -delete
          mv "$SIGNED" "${SIGNED%-signed.zip}.zip"
          ls -la

      # 4. Slanje ZIP fajla na server
      - name: Copy build to server
        uses: appleboy/scp-action@5878fc908fe21ff5041828e0e01da8a0f89f18c5 # v0.1.5
        with:
          host: ${{ env.PRODUCTION_SERVER_HOST }}
          username: ${{ env.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "IntelliJ-Plugin/build/distributions/Student-testing-IntelliJ-plugin-*.zip"
          target: "/var/www/intellij-plugins/build/distributions/"
          strip_components: 3
          overwrite: true

      # 5. Ažuriranje XML-a bez brisanja starih fajlova
      - name: Update updatePluginsStudent.xml
        uses: appleboy/ssh-action@d91a1af6f57cd4478ceee14d7705601dafabaa19 # v0.1.7
        with:
          host: ${{ env.PRODUCTION_SERVER_HOST }}
          username: ${{ env.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BASE_DIR="/var/www/intellij-plugins"
            DIST_DIR="$BASE_DIR/build/distributions"
            XML_PATH="$BASE_DIR/updatePluginsStudent.xml"
            SINCE_BUILD="${{ steps.props.outputs.since }}"
            
            # Tražimo najnoviji fajl po vremenu modifikacije
            LATEST_ZIP=$(ls -t $DIST_DIR/Student-testing-IntelliJ-plugin-*.zip 2>/dev/null | head -n 1)
            
            if [ -z "$LATEST_ZIP" ]; then
              echo "GRESKA: Nije pronađen nijedan ZIP."
              exit 1
            fi
            
            FILENAME=$(basename "$LATEST_ZIP")
            VERSION=$(echo "$FILENAME" | sed -E 's/Student-testing-IntelliJ-plugin-(.*)\.zip/\1/')
            PLUGIN_URL="http://157.180.37.247/build/distributions/$FILENAME"
            
            echo "Detektovana verzija na serveru: $VERSION (since-build $SINCE_BUILD)"

            # Provera duplikata u XML-u
            if [ -f "$XML_PATH" ] && grep -q "version=\"$VERSION\"" "$XML_PATH"; then
              echo "Verzija $VERSION već postoji u XML-u. Preskačem."
              exit 0
            fi

            # Inicijalizacija i xmlstarlet
            if [ ! -f "$XML_PATH" ]; then
               echo '<?xml version="1.0" encoding="UTF-8"?><plugins></plugins>' > "$XML_PATH"
            fi

            xmlstarlet ed -L \
              --subnode "/plugins" --type elem -n "plugin" -v "" \
              --var "L" "/plugins/plugin[last()]" \
              --insert "\$L" --type attr -n "id" -v "com.raf.studentski" \
              --insert "\$L" --type attr -n "url" -v "$PLUGIN_URL" \
              --insert "\$L" --type attr -n "version" -v "$VERSION" \
              --subnode "\$L" --type elem -n "name" -v "Studentski Plugin - RAF" \
              --subnode "\$L" --type elem -n "description" -v "Plugin za studente u IntelliJ-u" \
              --subnode "\$L" --type elem -n "idea-version" \
              --insert "\$L/idea-version" --type attr -n "since-build" -v "$SINCE_BUILD" \
              --insert "\$L/idea-version" --type attr -n "until-build" -v "999.*" \
              --subnode "\$L" --type elem -n "vendor" \
              --insert "\$L/vendor" --type attr -n "email" -v "zarkoned@outlook.com" \
              --insert "\$L/vendor" --type attr -n "url" -v "https://raf.edu.rs" \
              --subnode "\$L" --type elem -n "icon" \
              --insert "\$L/icon" --type attr -n "url" -v "http://157.180.37.247/pluginIcon.svg" \
              "$XML_PATH"
            
            echo "XML uspešno ažuriran na verziju $VERSION."